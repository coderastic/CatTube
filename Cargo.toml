[workspace]
members = [".", "crates/cattube-core"]
resolver = "3"

[package]
name = "cattube"
version = "1.0.4"
edition = "2024"
license = "MIT"
description = "A native Linux YouTube app for TV screens and remotes"
repository = "https://github.com/coderastic/CatTube"

[[bin]]
name = "cattube"
path = "src/main.rs"

[dependencies]
cattube-core = { path = "crates/cattube-core" }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "glow", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
